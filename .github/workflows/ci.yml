name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.ref_name == 'main' && github.run_id || 'pr' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Both lock primitives: macOS runs take lockf, Linux runs take flock.
        # Only the macOS run covers the lockf descriptor-mode spin that
        # test/sim-boot-lock-acquire.sh exists to catch.
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Suites
        run: |
          set -eu
          failed=""
          for suite in test/*.sh; do
            echo "::group::$suite"
            started=$(date +%s)
            rc=0
            # Each suite gets its own bound, well inside the job's: a suite that
            # hangs then fails here with its output and the process tree below,
            # where the job timeout would cancel it and keep no log at all.
            perl -e 'alarm shift; exec @ARGV' 240 sh "$suite" || rc=$?
            echo "$suite: rc=$rc after $(($(date +%s) - started))s"
            if [ "$rc" -eq 142 ]; then
              echo "::error::$suite did not finish within 240s; processes still running:"
              ps -axo pid,ppid,pgid,stat,etime,command
            fi
            echo "::endgroup::"
            [ "$rc" -eq 0 ] || failed="$failed $suite"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi

  baseline:
    # The checks every Curlew Labs repository runs, in one place:
    # https://github.com/curlewlabs-com/ci-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: curlewlabs-com/ci-baseline@d69603af6f9193526d118b6df8a3350bcbd92320 # v0.3.4

  conclusion:
    needs: [test, baseline]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Require every job to pass
        env:
          TEST: ${{ needs.test.result }}
          BASELINE: ${{ needs.baseline.result }}
        run: test "$TEST" = success && test "$BASELINE" = success
